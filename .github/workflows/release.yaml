name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer test
      - name: The tag is the plugin's version
        run: test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^ \* Version: *//p' metatavu-wordpress-iac.php)"
      - run: scripts/build.sh
      - name: Publish the zip and its checksum
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --title "$GITHUB_REF_NAME" \
            --notes "The must-use plugin. The project's bootstrap/ installs metatavu-wordpress-iac.php and metatavu-wordpress-iac/ into wp-content/mu-plugins/. The .sha256 file has the zip's checksum."
        env:
          GH_TOKEN: ${{ github.token }}
