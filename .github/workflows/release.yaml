name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Releases come from main only.
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: composer lint
      - run: composer test
      - name: The tag is the plugin's version
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(sed -n 's/^ \* Version: *//p' metatavu-wordpress-iac.php)"
      - run: scripts/build.sh
      - name: Publish the zip and its checksum
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/install-mu-plugin.sh dist/manage-package.sh dist/*.sha256 --title "$GITHUB_REF_NAME" \
            --notes "The must-use plugin, and the scripts a project's bootstrap/ runs over WP Engine's SSH gateway: install-mu-plugin.sh installs the plugin into wp-content/mu-plugins/, and manage-package.sh installs and removes whitelisted plugins and themes. Each .sha256 file has its file's checksum."
        env:
          GH_TOKEN: ${{ github.token }}
